[GLOBAL]
PATH: /opt/hblink/
PING_TIME: 5
MAX_MISSED: 10
USE_ACL: False
REG_ACL: PERMIT:ALL
SUB_ACL: PERMIT:ALL
TGID_TS1_ACL: PERMIT:ALL
TGID_TS2_ACL: PERMIT:ALL

[REPORTS]
REPORT: False
REPORT_INTERVAL: 30
REPORT_PORT: 4321
REPORT_CLIENTS: 127.0.0.1

[LOGGER]
LOG_FILE: /tmp/hblink.log
LOG_HANDLERS: console
LOG_LEVEL: INFO
LOG_NAME: HBlink

# Example Homebrew/MMDVM server. Documentation-only values.
[REPEATER-DEMO]
MODE: MASTER
ENABLED: True
REPEAT: True
MAX_PEERS: 1
EXPORT_AMBE: False
IP: 0.0.0.0
PORT: 62031
PASSPHRASE: change-me
GROUP_HANGTIME: 5
USE_ACL: False
REG_ACL: PERMIT:ALL
SUB_ACL: PERMIT:ALL
TGID_TS1_ACL: PERMIT:ALL
TGID_TS2_ACL: PERMIT:ALL

# Example OpenBridge link using RFC 5737 documentation addresses.
[OPENBRIDGE-DEMO]
MODE: OPENBRIDGE
ENABLED: False
IP: 192.0.2.10
PORT: 54000
NETWORK_ID: 1234567
PASSPHRASE: change-me
TARGET_IP: 198.51.100.20
TARGET_PORT: 54000
BOTH_SLOTS: False
USE_ACL: False
SUB_ACL: PERMIT:ALL
TGID_ACL: PERMIT:ALL

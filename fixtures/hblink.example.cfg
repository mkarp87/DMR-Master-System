[GLOBAL]
PATH: /opt/hblink/
PING_TIME: 5
MAX_MISSED: 10
USE_ACL: False
REG_ACL: PERMIT:ALL
SUB_ACL: PERMIT:ALL
TGID_TS1_ACL: PERMIT:ALL
TGID_TS2_ACL: PERMIT:ALL

[REPORTS]
REPORT: False
REPORT_INTERVAL: 30
REPORT_PORT: 4321
REPORT_CLIENTS: 127.0.0.1

[LOGGER]
LOG_FILE: /tmp/hblink.log
LOG_HANDLERS: console
LOG_LEVEL: INFO
LOG_NAME: HBlink

# Example Homebrew/MMDVM server. Documentation-only values.
[REPEATER-DEMO]
MODE: MASTER
ENABLED: True
REPEAT: True
MAX_PEERS: 1
EXPORT_AMBE: False
IP: 0.0.0.0
PORT: 62031
PASSPHRASE: change-me
GROUP_HANGTIME: 5
USE_ACL: False
REG_ACL: PERMIT:ALL
SUB_ACL: PERMIT:ALL
TGID_TS1_ACL: PERMIT:ALL
TGID_TS2_ACL: PERMIT:ALL

# Example OpenBridge link using RFC 5737 documentation addresses.
[OPENBRIDGE-DEMO]
MODE: OPENBRIDGE
ENABLED: False
IP: 192.0.2.10
PORT: 54000
NETWORK_ID: 1234567
PASSPHRASE: change-me
TARGET_IP: 198.51.100.20
TARGET_PORT: 54000
BOTH_SLOTS: False
USE_ACL: False
SUB_ACL: PERMIT:ALL
TGID_ACL: PERMIT:ALL

# Example Homebrew outbound/client link for staged migration.
[HBP-OUTBOUND-DEMO]
MODE: OUTBOUND
ENABLED: False
IP: 0.0.0.0
PORT: 0
TARGET_IP: 198.51.100.21
TARGET_PORT: 62031
PASSPHRASE: change-me
RADIO_ID: 1234567

# Example IPSC Master role. Role is protocol role, not hardware type.
[IPSC-MASTER-DEMO]
MODE: IPSC
ENABLED: False
IP: 0.0.0.0
PORT: 50000
IPSC_ROLE: master
RADIO_ID: 1234567
LINKING: 106
AUTH_KEY: change-me

# Example IPSC Peer role toward a documentation-only master address.
[IPSC-PEER-DEMO]
MODE: IPSC
ENABLED: False
IP: 0.0.0.0
PORT: 50001
IPSC_ROLE: peer
RADIO_ID: 1234568
MASTER_IP: 198.51.100.30
MASTER_PORT: 50000
LINKING: 106
AUTH_KEY: change-me

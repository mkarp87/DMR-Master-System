[workspace]
resolver = "2"
members = [
  "apps/dmr-master",
  "crates/dmr-core",
  "crates/dmr-config",
  "crates/dmr-router",
  "crates/dmr-protocol-hbp",
  "crates/dmr-protocol-openbridge",
  "crates/dmr-protocol-ipsc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
configparser = "3"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
